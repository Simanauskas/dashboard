name: Rename Garmin Activity

# Garmin tokens are only readable inside Actions (GitHub Secrets are write-only
# from outside) and by the auth.simas.fit Worker, so a one-off Garmin write has
# to run here. Dispatch only — never scheduled.
on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: 'Garmin activity id (blank = the one activity of `type` on `date`)'
        required: false
        default: ''
      name:
        description: 'New activity name (blank with list = read-only listing)'
        required: false
        default: ''
      date:
        description: 'Find the activity by date YYYY-MM-DD instead of id'
        required: false
        default: ''
      type:
        description: 'Activity typeKey filter for date/list, e.g. tennis_v2'
        required: false
        default: ''
      list:
        description: 'Read-only: print the N most recent activities (of `type`) with descriptions'
        required: false
        default: 
      description:
        description: 'Optional activity description'
        required: false
        default: ''
      distance:
        description: 'Optional distance in metres (e.g. 1000)'
        required: false
        default: ''
      apply:
        description: 'Write the change (false = dry run)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "garth==0.4.47"

      - name: Restore Garmin tokens
        run: |
          mkdir -p ~/.garth
          echo '${{ secrets.GARTH_OAUTH1 }}' > ~/.garth/oauth1_token.json
          echo '${{ secrets.GARTH_OAUTH2 }}' > ~/.garth/oauth2_token.json

      # Inputs go through env, never interpolated into the shell: a name
      # containing a quote or a backtick would otherwise run as code here.
      - name: Rename
        env:
          ACTIVITY_ID: ${{ inputs.activity_id }}
          NEW_NAME: ${{ inputs.name }}
          NEW_DESC: ${{ inputs.description }}
          NEW_DIST: ${{ inputs.distance }}
          APPLY: ${{ inputs.apply }}
          FIND_DATE: ${{ inputs.date }}
          TYPE_KEY: ${{ inputs.type }}
          LIST_N: ${{ inputs.list }}
        run: |
          if [ -n "$LIST_N" ]; then
            largs=(--list "$LIST_N"); if [ -n "$TYPE_KEY" ]; then largs+=(--type "$TYPE_KEY"); fi
            python rename_activity.py "${largs[@]}"; exit
          fi
          args=()
          if [ -n "$ACTIVITY_ID" ]; then args+=("$ACTIVITY_ID"); fi
          args+=("$NEW_NAME")
          if [ -n "$FIND_DATE" ]; then args+=(--date "$FIND_DATE"); fi
          if [ -n "$TYPE_KEY" ]; then args+=(--type "$TYPE_KEY"); fi
          if [ -n "$NEW_DESC" ]; then args+=(--description "$NEW_DESC"); fi
          if [ -n "$NEW_DIST" ]; then args+=(--distance "$NEW_DIST"); fi
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python rename_activity.py "${args[@]}"
