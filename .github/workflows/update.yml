name: Daily Garmin Update

on:
  # Scheduling moved to Cloudflare Worker (auth.simas.fit) for reliability.
  # GitHub Actions cron is best-effort and drifts 15-30+ min during high load.
  # Cloudflare cron triggers this workflow via workflow_dispatch hourly.
  # schedule:
  #   - cron: '0 5-9 * * *'     # 05:00-09:00 UTC — full update hourly until synced
  #   - cron: '0 10-20 * * *'   # 10:00-20:00 UTC — activities only
  workflow_dispatch:
    inputs:
      mode:
        description: 'full, activities, or backfill'
        required: false
        default: 'full'
      days:
        description: 'For backfill mode: days back to fetch (default 14)'
        required: false
        default: '14'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          # Enough history to rebase if main moves while this run is working.
          fetch-depth: 10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "garth==0.4.47" "garminconnect==0.2.8" requests

      - name: Restore Garmin tokens
        run: |
          mkdir -p ~/.garth
          echo '${{ secrets.GARTH_OAUTH1 }}' > ~/.garth/oauth1_token.json
          echo '${{ secrets.GARTH_OAUTH2 }}' > ~/.garth/oauth2_token.json

      - name: Validate tokens
        env:
          PAT: ${{ secrets.PAT }}
          REPO: ${{ github.repository }}
        run: python token_refresh.py

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 5 ] && [ "$HOUR" -le 9 ]; then
              echo "mode=full" >> $GITHUB_OUTPUT
            else
              echo "mode=activities" >> $GITHUB_OUTPUT
            fi
            echo "days=14" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ inputs.mode || 'full' }}" >> $GITHUB_OUTPUT
            echo "days=${{ inputs.days || '14' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run update
        run: python update.py --mode ${{ steps.mode.outputs.mode }} --days ${{ steps.mode.outputs.days }}

      - name: Commit and push if changed
        run: |
          git config user.name  "garmin-bot"
          git config user.email "bot@simanauskas.github.io"
          git add src/App.jsx

          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: sync $(date -u +%Y-%m-%dT%H:%MZ) mode=${{ steps.mode.outputs.mode }}"

          # main can move underneath us: tapping Renew dispatches a run of its own,
          # which overlaps the hourly cron whenever Renew happens near the top of
          # the hour. Rebase onto whatever landed first and retry.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — main moved, rebasing onto it"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              # App.jsx is machine-generated and the run that beat us wrote data at
              # least as fresh as ours, so its version wins. Dropping this run's
              # patch is correct, not a loss — but say so rather than exiting quietly.
              echo "::warning::rebase conflict on generated App.jsx; dropped this run's patch, next sync carries it"
              exit 0
            fi
            sleep 3
          done

          echo "::error::push still failing after 3 rebases — this is not the Renew/cron race, check the PAT"
          exit 1
