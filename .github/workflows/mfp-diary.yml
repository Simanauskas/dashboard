name: MFP food log (private repo)

# Pulls the per-entry MyFitnessPal diary for analysis and stores it in the
# PRIVATE repo Simanauskas/diary-private. This repo is PUBLIC, so:
#   * the plaintext only ever exists on the runner and in the private repo,
#   * mfp.py never prints food names to the log (counts only),
#   * nothing is uploaded as an artifact and nothing is committed here.
# Needs the DIARY_PAT secret: a fine-grained token with Contents read/write on
# diary-private only.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days back to fetch (30 = today + 29 back)'
        required: false
        default: '30'

permissions:
  contents: read

jobs:
  diary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Fetch diary (not printed)
        env:
          MFP_TOKEN: ${{ secrets.MFP_TOKEN }}
          DAYS: ${{ inputs.days || '30' }}
        run: python mfp.py --diary --days "$(( DAYS - 1 ))"

      - name: Check out the private repo
        uses: actions/checkout@v4
        with:
          repository: Simanauskas/diary-private
          token: ${{ secrets.DIARY_PAT }}
          path: diary-private

      - name: Save to the private repo
        run: |
          test -s data/private/mfp-diary.json || { echo "::error::no diary written (token expired / MFP not connected?)"; exit 1; }
          cp data/private/mfp-diary.json diary-private/mfp-diary.json
          shred -u data/private/mfp-diary.json || rm -f data/private/mfp-diary.json
          cd diary-private
          git config user.name  "garmin-bot"
          git config user.email "bot@simanauskas.github.io"
          git add mfp-diary.json
          if git diff --staged --quiet; then
            echo "diary unchanged — nothing to commit"
            exit 0
          fi
          git commit -q -m "diary $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
