name: MFP log meal (dev — temporary)
# Temporary: lets mfp_log.py be tested from the feature branch before the
# dispatch workflow exists on main. Deleted before merge.
on:
  push:
    branches: [claude/adoring-archimedes-d2ca1q]
    paths: ['.mfp-dev.json']
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    env:
      MFP_TOKEN: ${{ secrets.MFP_TOKEN }}
      TZ: Europe/Vilnius
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          python - <<'PY'
          import json, subprocess, sys
          for args in json.load(open('.mfp-dev.json'))["runs"]:
              print("\n$ mfp_log.py", " ".join(args), flush=True)
              subprocess.run([sys.executable, "mfp_log.py", *args])
          PY
